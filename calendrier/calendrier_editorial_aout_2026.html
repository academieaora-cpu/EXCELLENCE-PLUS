<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excellence+ — Calendrier Éditorial — AORA</title>
<style>
  :root{
    --navy:#1B2D5C; --orange:#F37021; --navy2:#2A3F6E;
    --bg:#F4F6FB; --txt:#1A2332; --grey:#6B7280; --line:#E2E8F0; --white:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--txt);line-height:1.5;padding-bottom:60px}
  /* ---------- Niveau 1 : en-tête ---------- */
  .topbar{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:22px 28px;
          display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .topbar img{height:48px;width:auto;background:#fff;border-radius:8px;padding:4px}
  .topbar .ttl{flex:1;min-width:220px}
  .topbar h1{font-size:22px;font-weight:800;letter-spacing:.2px}
  .topbar .sub{font-size:13px;opacity:.85;margin-top:3px}
  .topbar .ver{background:var(--orange);color:#fff;font-weight:700;font-size:12px;
               padding:4px 12px;border-radius:999px}
  .controls{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);
            padding:14px 28px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .controls input[type=search],.controls select{font-size:14px;padding:9px 12px;border:1px solid var(--line);
            border-radius:8px;background:#fff;color:var(--txt)}
  .controls input[type=search]{flex:1;min-width:200px}
  .controls label.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--grey);cursor:pointer}
  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 28px;font-size:12px;color:var(--grey)}
  .legend .lg{display:flex;align-items:center;gap:6px}
  .legend .dot{width:11px;height:11px;border-radius:3px;display:inline-block}
  /* ---------- Niveau 2 : semaines + cartes ---------- */
  main{padding:8px 28px}
  .week{margin:22px 0 8px}
  .week h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--navy);
           font-weight:800;border-left:4px solid var(--orange);padding-left:10px;margin-bottom:12px}
  .week .dates{color:var(--grey);font-weight:500;text-transform:none;letter-spacing:0;font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:12px;
        padding:14px 14px 12px;cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(27,45,92,.12)}
  .card .id{font-size:11px;font-weight:800;color:var(--orange);letter-spacing:.5px}
  .card .ct{font-size:15px;font-weight:700;margin:4px 0 8px;color:var(--navy);padding-right:26px}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .badge{font-size:10.5px;font-weight:700;color:#fff;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .badge.fmt{background:var(--grey)}
  .card .date{font-size:12px;color:var(--grey)}
  .mini-prog{height:5px;background:var(--line);border-radius:999px;margin-top:9px;overflow:hidden}
  .mini-prog>i{display:block;height:100%;background:var(--orange);border-radius:999px}
  .fav{position:absolute;top:12px;right:12px;font-size:18px;line-height:1;border:0;background:none;
       cursor:pointer;color:#CBD5E1}
  .fav.on{color:var(--orange)}
  .empty{color:var(--grey);font-size:13px;padding:20px;text-align:center}
  /* ---------- Sections réserve / documentation ---------- */
  .block{margin:34px 0 8px}
  .block h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--navy);font-weight:800;
            border-left:4px solid var(--grey);padding-left:10px;margin-bottom:12px}
  .card.reserve{border-top-color:var(--grey);opacity:.92}
  .card.doc{border-top-color:var(--orange)}
  .card.doc .ct{color:var(--navy)}
  /* ---------- Niveau 3 : modale ---------- */
  .design-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:100;
                  align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
  .design-overlay.show{display:flex}
  .design-modal{background:#fff;border-radius:16px;max-width:840px;width:100%;overflow:hidden;
                box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .design-head{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;
               padding:22px 26px;position:relative}
  .design-close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;
                border:0;background:rgba(255,255,255,.18);color:#fff;font-size:16px;cursor:pointer}
  .design-close:hover{background:rgba(255,255,255,.32)}
  .breadcrumb{font-size:12px;opacity:.85;margin-bottom:8px}
  .breadcrumb span{cursor:pointer}.breadcrumb span:hover{text-decoration:underline}
  .breadcrumb .sep{margin:0 6px;cursor:default;opacity:.6}
  .design-kicker{font-size:12px;font-weight:800;color:var(--orange);letter-spacing:.5px}
  .design-title{font-size:21px;font-weight:800;margin:4px 0 10px;padding-right:40px}
  .design-tag-row{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:10.5px;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:999px}
  .design-meta-row{display:flex;align-items:center;gap:18px;margin-top:14px;flex-wrap:wrap}
  .fav-toggle{border:0;background:rgba(255,255,255,.16);color:#fff;font-size:13px;padding:6px 12px;
              border-radius:8px;cursor:pointer}
  .fav-toggle.on{background:var(--orange)}
  .progress-wrap{display:flex;align-items:center;gap:8px;flex:1;min-width:160px}
  .progress-track{flex:1;height:7px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
  .progress-fill{height:100%;background:var(--orange);border-radius:999px;width:0}
  .progress-label{font-size:12px;font-weight:700}
  .design-body{padding:18px 26px 22px;max-height:62vh;overflow:auto}
  details.acc{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
  details.acc>summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:700;color:var(--navy);
                      background:#F8FAFC;font-size:14px;display:flex;align-items:center;gap:8px}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary::before{content:"▸";color:var(--orange);font-size:12px;transition:transform .15s}
  details.acc[open]>summary::before{transform:rotate(90deg)}
  .acc-body{padding:12px 16px;font-size:14px;white-space:pre-wrap}
  .acc-body ul{margin:0 0 0 18px}
  .acc-body li{margin-bottom:4px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}
  .kv .k{color:var(--grey);font-weight:600}
  .hist{font-size:13px;color:var(--grey)}
  .hist li{margin-bottom:5px}
  /* scene table (Niveau 4) */
  table.scenes{width:100%;border-collapse:collapse;font-size:13.5px}
  table.scenes th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-size:12px}
  table.scenes td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top}
  table.scenes tr.srow{cursor:pointer}
  table.scenes tr.srow:hover{background:#F1F5F9}
  .snum{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fff;
        font-weight:800;font-size:12px;align-items:center;justify-content:center}
  /* scene detail (Niveau 5) */
  .scene-detail .back{border:0;background:#F1F5F9;color:var(--navy);font-weight:700;padding:8px 14px;
                      border-radius:8px;cursor:pointer;margin-bottom:14px}
  .scene-detail h3{color:var(--navy);font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .design-actions{margin-top:14px;display:flex;justify-content:flex-end}
  .design-copy-btn{background:var(--orange);color:#fff;border:0;padding:9px 16px;border-radius:8px;
                   font-weight:700;cursor:pointer;font-size:13px}
  .bottom{margin:40px 28px 0;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--grey)}
  .bottom b{color:var(--navy)}
  @media(max-width:560px){.kv{grid-template-columns:1fr}}
</style>
</head>

(function applyTheme(){

})();

const PMAP={}; PILLARS.forEach(p=>PMAP[p.id]=p);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const pillarName=id=>(PMAP[id]&&PMAP[id].nom)||'';
const pillarColor=id=>(PMAP[id]&&PMAP[id].couleur)||getComputedStyle(document.documentElement).getPropertyValue('--grey');

/* ====== Favoris (persistance robuste) ====== */
const FavStore=(function(){
  const key='aora_cal_fav_'+((CONFIG&&CONFIG.client)||'x');
  let state={}; ENTRIES.forEach(e=>{if(e.favori)state[e.id]=true;});
  try{const s=JSON.parse(localStorage.getItem(key)||'null');if(s)state=Object.assign(state,s);}catch(e){}
  function persist(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){}}
  return{is:id=>!!state[id],toggle:id=>{state[id]?delete state[id]:state[id]=true;persist();return !!state[id];}};
})();

/* ====== Rendu cartes ====== */
function cardHTML(e,opts){
  opts=opts||{};
  const pc=pillarColor(e.pilier);
  const fav=FavStore.is(e.id);
  const prog=e.progression!=null?e.progression:(opts.reserve?null:0);
  return `<div class="card${opts.reserve?' reserve':''}${opts.doc?' doc':''}" data-id="${esc(e.id)}" data-kind="${opts.doc?'doc':(opts.reserve?'reserve':'entry')}" style="border-top-color:${opts.doc?'':esc(pc)}">
    ${opts.doc?'':`<button class="fav ${fav?'on':''}" data-fav="${esc(e.id)}" title="Favori">★</button>`}
    <div class="id">${esc(e.id)}</div>
    <div class="ct">${esc(e.titre)}</div>
    <div class="meta">
      ${e.pilier?`<span class="badge" style="background:${esc(pc)}">${esc(pillarName(e.pilier))}</span>`:''}
      ${e.format?`<span class="badge fmt">${esc(e.format)}</span>`:''}
    </div>
    ${e.date?`<div class="date">📅 ${esc(e.date)}</div>`:''}
    ${e.motif_reserve?`<div class="date">↪ ${esc(e.motif_reserve)}</div>`:''}
    ${prog!=null?`<div class="mini-prog"><i style="width:${Math.max(0,Math.min(100,prog))}%"></i></div>`:''}
  </div>`;
}
function matches(e,q){
  if(!q)return true;q=q.toLowerCase();
  const hay=[e.id,e.titre,e.resume,e.description,e.contenu,e.notes,(e.tags||[]).join(' '),
    e.visuel?Object.values(e.visuel).map(x=>Array.isArray(x)?x.join(' '):x).join(' '):'',
    (e.scenes||[]).map(s=>[s.dialogue,s.objectif,s.decor].join(' ')).join(' ')].join(' ').toLowerCase();
  return hay.indexOf(q)>=0;
}
function renderCalendar(){
  const q=document.getElementById('search').value.trim();
  const fp=document.getElementById('fPillar').value;
  const fs=document.getElementById('fStatus').value;
  const ff=document.getElementById('fFav').checked;
  const root=document.getElementById('calendarRoot');root.innerHTML='';
  let total=0;
  WEEKS.forEach(w=>{
    let items=ENTRIES.filter(e=>e.semaine===w.id);
    items=items.filter(e=>matches(e,q))
               .filter(e=>!fp||e.pilier===fp)
               .filter(e=>!fs||(e.validation&&e.validation.statut===fs))
               .filter(e=>!ff||FavStore.is(e.id));
    if(!items.length)return;
    total+=items.length;
    const html=`<div class="week"><h2>${esc(w.label)} <span class="dates">· ${esc(w.dates||'')}</span></h2>
      <div class="grid">${items.map(e=>cardHTML(e)).join('')}</div></div>`;
    root.insertAdjacentHTML('beforeend',html);
  });
  if(!total)root.innerHTML='<div class="empty">Aucun livrable ne correspond aux filtres.</div>';
  // réserve & docs (filtrés par recherche seulement)
  const rb=document.getElementById('reserveBlock'),rr=document.getElementById('reserveRoot');
  const rItems=RESERVE.filter(e=>matches(e,q)).filter(e=>!fp||e.pilier===fp);
  if(rItems.length&&!ff){rr.innerHTML=rItems.map(e=>cardHTML(e,{reserve:true})).join('');rb.style.display='';}else{rb.style.display='none';}
  const db=document.getElementById('docsBlock'),dr=document.getElementById('docsRoot');
  const dItems=DOCS.filter(d=>matches(d,q));
  if(dItems.length&&!ff&&!fp&&!fs){dr.innerHTML=dItems.map(d=>cardHTML(d,{doc:true})).join('');db.style.display='';}else{db.style.display='none';}
}

function accSection(title,bodyHTML){
  if(!bodyHTML)return'';
  return `<details class="acc"><summary>${title}</summary><div class="acc-body">${bodyHTML}</div></details>`;
}
function listHTML(arr){if(!arr||!arr.length)return'';return'<ul>'+arr.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';}

function buildAccordions(e){
  let h='';
  // Documentation card (simple)
  if(e.corps!==undefined){return `<details class="acc" open><summary>📄 Référence</summary><div class="acc-body">${esc(e.corps)}</div></details>`;}
  h+=`<details class="acc" open><summary>📝 Résumé</summary><div class="acc-body">${esc(e.resume||'—')}</div></details>`;
  if(e.objectifs&&e.objectifs.length)h+=accSection('🎯 Objectifs',listHTML(e.objectifs));
  if(e.description)h+=accSection('🧭 Description',esc(e.description));
  if(e.contenu)h+=accSection('✍️ Contenu (prêt à exploiter)',esc(e.contenu));
  if(e.visuel)h+=accSection('🖼️ Direction visuelle (image à insérer)',visuelHTML(e.visuel));
  if(e.scenes&&e.scenes.length)h+=accSection('🎬 Storyboard',sceneTableHTML(e));
  if(e.production){
    const p=e.production;
    h+=accSection('🛠️ Production',`<div class="kv">
      <span class="k">Responsable</span><span>${esc(p.responsable||'—')}</span>
      <span class="k">Délai</span><span>${esc(p.delai||'—')}</span>
      <span class="k">Dépendances</span><span>${(p.dependances||[]).map(esc).join(', ')||'—'}</span></div>`);
  }
  if(e.validation){
    const v=e.validation;
    h+=accSection('✅ Validation',`<div class="kv"><span class="k">Statut</span><span>${esc(v.statut||'—')}</span></div>`
      +(v.historique&&v.historique.length?`<ul class="hist">${v.historique.map(x=>`<li>${esc(x.date)} — ${esc(x.evt)}</li>`).join('')}</ul>`:''));
  }
  if(e.notes)h+=accSection('🗒️ Notes',esc(e.notes));
  if(e.historique&&e.historique.length)h+=accSection('📜 Historique',
    `<ul class="hist">${e.historique.map(x=>`<li>${esc(x.date)} — ${esc(x.evt)}</li>`).join('')}</ul>`);
  if(e.motif_reserve)h+=accSection('📦 Réserve',esc(e.motif_reserve));
  return h;
}
function visuelHTML(v){
  const join=x=>Array.isArray(x)?x.join(', '):x;
  const row=(k,val)=>val?`<span class="k">${esc(k)}</span><span>${esc(join(val))}</span>`:'';
  return `<div class="kv">
    ${row('Sujet / image',v.sujet)}${row('Décor / fond',v.decor)}${row('Éléments',v.elements)}
    ${row('Cadrage',v.cadrage)}${row('Ambiance',v.ambiance)}${row('Prompt IA',v.prompt_ia)}
    ${row('Références',v.references)}${row('À éviter',v.a_eviter)}
  </div>`;
}
function sceneTableHTML(e){
  return `<table class="scenes"><thead><tr><th>#</th><th>Objectif</th><th>Décor</th><th>Durée</th></tr></thead><tbody>
    ${e.scenes.map((s,i)=>`<tr class="srow" data-scene="${i}">
      <td><span class="snum">${esc(s.n!=null?s.n:i+1)}</span></td>
      <td>${esc(s.objectif||'')}</td><td>${esc(s.decor||'')}</td><td>${esc(s.duree||'')}</td></tr>`).join('')}
  </tbody></table>`;
}
function sceneDetailHTML(e,i){
  const s=e.scenes[i]||{};
  const row=(k,v)=>v?`<span class="k">${k}</span><span>${esc(v)}</span>`:'';
  return `<button class="back" id="sceneBack">← Retour au livrable</button>
    <h3><span class="snum">${esc(s.n!=null?s.n:i+1)}</span> Scène ${esc(s.n!=null?s.n:i+1)}</h3>
    <div class="kv">
      ${row('Décor',s.decor)}${row('Personnages',s.personnages)}${row('Caméra',s.camera)}
      ${row('Angles',s.angles)}${row('Dialogue',s.dialogue)}${row('Voix off',s.voix_off)}
      ${row('Effets',s.effets)}${row('Musique',s.musique)}${row('Durée',s.duree)}
      ${row('Transitions',s.transitions)}${row('Objectif',s.objectif)}
      ${row('Prompt IA',s.prompt_ia)}${row('Références',s.references)}
    </div>`;
}
function setBreadcrumb(e,sceneIdx){
  const bc=document.getElementById('modalBreadcrumb');

function openEntry(id){
  const e=findEntry(id);if(!e)return;CURRENT=e;
  document.getElementById('modalKicker').textContent=
    (e.corps!==undefined?'Documentation':(pillarName(e.pilier)||(e.motif_reserve?'Réserve':'')))+(e.format?' · '+e.format:'');

  const ft=document.getElementById('modalFavToggle'),isDoc=e.corps!==undefined;

  document.getElementById('modalProgressFill').style.width=Math.max(0,Math.min(100,pr))+'%';
  document.getElementById('modalProgressLabel').textContent=isDoc?'':pr+'%';
  document.querySelector('.progress-wrap').style.display=isDoc?'none':'';

  document.getElementById('modalAccordionView').innerHTML=buildAccordions(e);
  document.getElementById('modalAccordionView').style.display='';

  setBreadcrumb(e,null);

  document.querySelector('.design-body').scrollTop=0;
}
function openScene(i){

document.body.addEventListener('click',ev=>{

  if(fav){ev.stopPropagation();const on=FavStore.toggle(fav.getAttribute('data-fav'));fav.classList.toggle('on',on);return;}
  const card=ev.target.closest('.card');
  if(card){openEntry(card.getAttribute('data-id'));return;}
  const srow=ev.target.closest('tr.srow');
  if(srow){openScene(parseInt(srow.getAttribute('data-scene'),10));return;}
  const bc=ev.target.closest('[data-bc]');
  if(bc){const t=bc.getAttribute('data-bc');if(t==='cal')closeModal();else if(t==='entry'&&CURRENT)openEntry(CURRENT.id);}
});

    if(e.visuel){const v=e.visuel,j=x=>Array.isArray(x)?x.join(', '):x;
      txt+='\n\nDirection visuelle :';
      [['Sujet/image',v.sujet],['Décor',v.decor],['Éléments',v.elements],['Cadrage',v.cadrage],
       ['Ambiance',v.ambiance],['Prompt IA',v.prompt_ia],['Références',v.references],['À éviter',v.a_eviter]]
       .forEach(([k,val])=>{if(val)txt+=`\n- ${k} : ${j(val)}`;});}
    if(e.scenes&&e.scenes.length)txt+='\n\n'+e.scenes.map(s=>`Scène ${s.n}: ${s.objectif||''}\n${s.dialogue||''}`).join('\n\n');
  }
  navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>{
    const b=document.getElementById('modalCopyBtn');b.textContent='Copié ✓';setTimeout(()=>b.textContent='Copier le texte',1400);
  });
});

(function footer(){
  const f=document.getElementById('footer');
  const total=ENTRIES.length,res=RESERVE.length;
  f.innerHTML=`<b>AORA Communication Agency</b> — ${esc(CONFIG.client||'')} · ${esc(CONFIG.projet||'')} ${esc(CONFIG.version||'')} · ${esc(CONFIG.date_doc||'')}
    · Document interne de production · ${total} livrables actifs, ${res} en réserve.
    ${CONFIG.signature_marque?'<br>Signature client : « '+esc(CONFIG.signature_marque)+' ».':''}`;
})();

renderCalendar();
</script>
